<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      (function () {
        var isGithubPages = window.location.hostname.endsWith('github.io');
        var base = isGithubPages ? '/shopper/' : '/';
        var l = window.location;
        var fullPath = l.pathname + l.search + l.hash;
        var stripped = fullPath.startsWith(base) ? fullPath.slice(base.length) : fullPath;
        var target = base + '?path=' + encodeURIComponent(stripped);
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
